<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b21b6"><title>AI Lottery Lab Professional 3.0.0</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css?v=300"></head><body>
<header><div class="brand"><div class="logo">AI</div><div><h1>AI Lottery Lab</h1><p>Professional <span data-version>3.0.0</span></p></div></div><div class="games"><button data-game="loto6" class="active">6 ロト6</button><button data-game="loto7">7 ロト7</button></div></header>
<nav><button data-tab="home" class="active">ホーム</button><button data-tab="predict">予想</button><button data-tab="purchase">購入5口</button><button data-tab="verify">検証</button><button data-tab="report">レポート</button></nav>
<main>
<section id="home" class="tab active"><div class="card hero"><h2 id="gameTitle">ロト6</h2><div class="status-grid"><article><span>最新回</span><b id="latestNo">-</b></article><article><span>取得状態</span><b id="sourceStatus">未確認</b></article></div><div id="latestBalls" class="balls"></div><p id="latestMeta" class="muted">公式データを確認してください。</p><button id="refreshOfficial" class="primary">公式最新データを取得</button><pre id="apiDiag" class="diag"></pre></div><div class="card"><h3>データ健全性</h3><div id="health"></div></div></section>
<section id="predict" class="tab"><div class="card"><h2>次回予想5口</h2><p class="muted">過去傾向を研究用スコアとして利用します。当せん確率を保証しません。</p><button id="generate" class="primary">5口を生成</button><div id="predictions"></div></div></section>
<section id="purchase" class="tab"><div class="card"><h2>購入5口を保存</h2><label>対象回<input id="purchaseNo" inputmode="numeric"></label><label>5口（1行1口、カンマ区切り）<textarea id="purchaseSets" rows="7"></textarea></label><button id="savePurchase" class="primary">保存</button><div id="purchaseHistory"></div></div></section>
<section id="verify" class="tab"><div class="card"><h2>自動照合</h2><p id="verifyGuide" class="muted">公式最新回と同じ対象回の購入5口だけを照合します。</p><button id="runVerify" class="primary">最新結果で照合</button><div id="verifyResult"></div></div></section>
<section id="report" class="tab"><div class="card"><h2>特徴量レポート</h2><div id="reportBody"><p class="muted">照合後に表示します。</p></div></div></section>
</main><footer>AI Lottery Lab Professional <span data-version>3.0.0</span>｜研究・記録用</footer><script src="app.js?v=300"></script></body></html>
